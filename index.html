a{color:inherit}

.route small{font-weight:500;opacity:.85;font-size:11px}
.route-legend{font-size:12px;color:var(--muted);margin-bottom:6px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-top:12px}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:12px 10px;border-bottom:2.5px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,.daychips button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.daychips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:4;background:var(--bg);padding-block:10px}
.daychips .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

.daychips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums}

.daychips button.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

main{padding-block:4px 48px}
section[hidden]{display:none}

.pill.warn{background:var(--chip);color:var(--ink);font-weight:500}

.slot{display:grid;grid-template-columns:62px 1fr;gap:10px;padding-top:10px}
.slot + .slot{border-top:1px dashed var(--line);margin-top:8px}
.slot-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}

.slot li{display:grid;grid-template-columns:44px 1fr;gap:6px;min-width:0}

.slot li .n{min-width:0}

.slot li .n strong{font-weight:600}
.slot li .n a.tl{border:0;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:#fff;background:#e8542e;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.slot li .n a.tl::after{content:none}
.slot li .n .move{color:var(--muted);font-weight:500}

.tag.food{color:var(--osaka)}
.tag.shop{color:var(--tokyo)}
.tip{margin:0 14px 12px;font-size:12.5px;background:var(--chip);border-radius:8px;padding:8px 10px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.must{display:inline-block;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;margin-top:3px}

.check input:checked + label .h{text-decoration:line-through;color:var(--muted)}
footer{font-size:12px;color:var(--muted);padding-block:8px 24px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function todayStr(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
const TODAY=todayStr();

// status line
(function(){
  const st=document.getElementById('status');
  const start=parseD(DAYS[0].d), end=parseD(DAYS[DAYS.length-1].d), t=parseD(TODAY);
  const diff=Math.round((start-t)/864e5);
  if(diff>1) st.textContent=`Geziye ${diff} gün kaldı`;
  else if(diff===1) st.textContent='Gezi yarın başlıyor · KIX 18:50';
  else if(t<=end){const i=DAYS.findIndex(x=>x.d===TODAY);st.textContent=`Bugün ${i+1}. gün · ${DAYS[i].city}${DAYS[i].area?' · '+DAYS[i].area:''}`}
  else st.textContent='Gezi tamamlandı';
})();

    <div class="dnum" style="background:${cvar(x.city)}"><b>${dt.getDate()}</b><span>${MON[dt.getMonth()].toUpperCase()}</span></div>

}
